<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DegnisDeV - En Mantenimiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1D3557 0%, #00ff90 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .maintenance-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 20px;
        }

        .maintenance-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .contact-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .contact-info h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            font-size: 1rem;
        }

        .contact-item i {
            margin-right: 10px;
            width: 20px;
        }

        a {
            color: #fff;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        a:hover {
            opacity: 0.7;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            width: 65%;
            animation: loading 3s ease-in-out infinite;
        }

        @keyframes loading {

            0%,
            100% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(100%);
            }
        }

        @media (max-width: 768px) {
            .maintenance-container {
                padding: 40px 20px;
                margin: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .maintenance-icon {
                font-size: 80px;
            }
        }
    </style>
</head>

<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">⚙️</div>

        <h1>DegnisDeV</h1>
        <p class="subtitle">Sitio en Mantenimiento</p>

        <div class="message">
            <p>¡Hola! 👋</p>
            <p>Estoy trabajando en algunas mejoras increíbles para ofrecerte una mejor experiencia.</p>
            <p>El sitio estará disponible nuevamente muy pronto.</p>
        </div>

        <div class="contact-info">
            <h3>¿Necesitas contactarme?</h3>
            <div class="contact-item">
                <span>📧</span>
                <a href="mailto:degnisdev@gmail.com">degnisdev@gmail.com</a>
            </div>
            <div class="contact-item">
                <span>💼</span>
                <span>Desarrollador & Diseñador Web</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <p style="margin-top: 20px; opacity: 0.6; font-size: 0.9rem;">
            Gracias por tu paciencia ✨
        </p>
    </div>
</body>

</html>
